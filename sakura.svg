<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0b16"/>
      <stop offset="55%" stop-color="#2b0f24"/>
      <stop offset="100%" stop-color="#3d1433"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#ff7eb6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff7eb6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd1e6"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffb3d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Pétale de sakura (avec l'encoche au bout) -->
    <path id="petal" d="M0,-9 L-1.6,-6.5 C-6,-10 -9,-3 -6,2 C-4,6 -1,8 0,9 C1,8 4,6 6,2 C9,-3 6,-10 1.6,-6.5 Z"/>
    <!-- Fleur à 5 pétales -->
    <g id="flower">
      <use href="#petal" transform="translate(0,-9)"/>
      <use href="#petal" transform="rotate(72) translate(0,-9)"/>
      <use href="#petal" transform="rotate(144) translate(0,-9)"/>
      <use href="#petal" transform="rotate(216) translate(0,-9)"/>
      <use href="#petal" transform="rotate(288) translate(0,-9)"/>
      <circle r="3.2" fill="#ff4f9a"/>
    </g>
    <style>
      .fa { animation: fa linear infinite; }
      .fb { animation: fb linear infinite; }
      .fc { animation: fc linear infinite; }
      @keyframes fa { 0%{transform:translate(0,-40px)} 25%{transform:translate(28px,45px)} 50%{transform:translate(-6px,130px)} 75%{transform:translate(30px,215px)} 100%{transform:translate(6px,340px)} }
      @keyframes fb { 0%{transform:translate(0,-40px)} 25%{transform:translate(-30px,45px)} 50%{transform:translate(8px,130px)} 75%{transform:translate(-26px,215px)} 100%{transform:translate(-10px,340px)} }
      @keyframes fc { 0%{transform:translate(0,-40px)} 50%{transform:translate(45px,150px)} 100%{transform:translate(90px,340px)} }
      .spin { animation: spin linear infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
      .name { animation: pulse 4s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.88} }
      .ic { animation: bob 3s ease-in-out infinite; }
      @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    </style>
    <clipPath id="frame"><rect width="1000" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
  <rect width="1000" height="300" fill="url(#sky)"/>
  <rect width="1000" height="300" fill="url(#halo)"/>

  <!-- Branche de cerisier (coin haut gauche) -->
  <g opacity="0.9">
    <path d="M-10,40 C60,50 110,30 170,60 C200,75 230,70 260,58" stroke="#5a2a3d" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M90,42 C110,15 130,10 150,5" stroke="#5a2a3d" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M170,60 C185,90 200,100 215,108" stroke="#5a2a3d" stroke-width="4" fill="none" stroke-linecap="round"/>
    <use href="#flower" transform="translate(60,40) scale(1.1)" fill="#ffc0dc"/>
    <use href="#flower" transform="translate(150,8) scale(0.9)" fill="#ffd6e8"/>
    <use href="#flower" transform="translate(120,48) scale(0.8)" fill="#ff9fc8"/>
    <use href="#flower" transform="translate(215,108) scale(1)" fill="#ffc0dc"/>
    <use href="#flower" transform="translate(255,56) scale(0.85)" fill="#ffd6e8"/>
    <use href="#flower" transform="translate(185,72) scale(0.6)" fill="#ff9fc8"/>
  </g>
  <!-- Branche de cerisier (coin haut droit) -->
  <g opacity="0.9" transform="translate(1000,0) scale(-1,1)">
    <path d="M-10,30 C50,45 100,25 160,50 C185,60 205,58 225,50" stroke="#5a2a3d" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M140,44 C150,70 165,82 180,88" stroke="#5a2a3d" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <use href="#flower" transform="translate(50,36) scale(1)" fill="#ffd6e8"/>
    <use href="#flower" transform="translate(110,34) scale(0.75)" fill="#ff9fc8"/>
    <use href="#flower" transform="translate(180,88) scale(0.9)" fill="#ffc0dc"/>
    <use href="#flower" transform="translate(225,50) scale(0.8)" fill="#ffd6e8"/>
  </g>

  <!-- Pétales en arrière-plan -->
  <g transform="translate(112,0)"><g class="fb" style="animation-duration:12.4s;animation-delay:-0.7s"><g class="spin" style="animation-duration:5.1s"><use href="#petal" transform="scale(0.64)" fill="#ff9fc8" opacity="0.56"/></g></g></g>
  <g transform="translate(356,0)"><g class="fa" style="animation-duration:11.4s;animation-delay:-9.3s"><g class="spin" style="animation-duration:7.2s"><use href="#petal" transform="scale(0.86)" fill="#ffd6e8" opacity="0.56"/></g></g></g>
  <g transform="translate(0,0)"><g class="fa" style="animation-duration:11.5s;animation-delay:-1.4s"><g class="spin" style="animation-duration:4.0s"><use href="#petal" transform="scale(0.84)" fill="#ff9fc8" opacity="0.65"/></g></g></g>
  <g transform="translate(641,0)"><g class="fa" style="animation-duration:12.3s;animation-delay:-4.8s"><g class="spin" style="animation-duration:3.9s"><use href="#petal" transform="scale(0.91)" fill="#ffe4f0" opacity="0.68"/></g></g></g>
  <g transform="translate(791,0)"><g class="fc" style="animation-duration:16.5s;animation-delay:-7.7s"><g class="spin" style="animation-duration:6.0s"><use href="#petal" transform="scale(0.58)" fill="#ffd6e8" opacity="0.46"/></g></g></g>
  <g transform="translate(437,0)"><g class="fa" style="animation-duration:14.6s;animation-delay:-3.4s"><g class="spin" style="animation-duration:7.1s"><use href="#petal" transform="scale(0.66)" fill="#ff9fc8" opacity="0.64"/></g></g></g>
  <g transform="translate(983,0)"><g class="fc" style="animation-duration:13.5s;animation-delay:-9.8s"><g class="spin" style="animation-duration:6.9s"><use href="#petal" transform="scale(0.71)" fill="#ff9fc8" opacity="0.69"/></g></g></g>
  <g transform="translate(433,0)"><g class="fc" style="animation-duration:10.3s;animation-delay:-4.4s"><g class="spin" style="animation-duration:5.2s"><use href="#flower" transform="scale(0.40)" fill="#ff9fc8" opacity="0.58"/></g></g></g>
  <g transform="translate(500,0)"><g class="fc" style="animation-duration:14.4s;animation-delay:-4.7s"><g class="spin" style="animation-duration:5.5s"><use href="#petal" transform="scale(0.68)" fill="#ffc0dc" opacity="0.56"/></g></g></g>
  <g transform="translate(985,0)"><g class="fc" style="animation-duration:15.4s;animation-delay:-7.1s"><g class="spin" style="animation-duration:8.2s"><use href="#petal" transform="scale(0.95)" fill="#ffc0dc" opacity="0.65"/></g></g></g>
  <g transform="translate(254,0)"><g class="fb" style="animation-duration:15.1s;animation-delay:-2.9s"><g class="spin" style="animation-duration:3.5s"><use href="#petal" transform="scale(0.61)" fill="#ff9fc8" opacity="0.55"/></g></g></g>
  <g transform="translate(585,0)"><g class="fb" style="animation-duration:14.3s;animation-delay:-13.0s"><g class="spin" style="animation-duration:3.3s"><use href="#petal" transform="scale(0.87)" fill="#ffc0dc" opacity="0.68"/></g></g></g>
  <g transform="translate(718,0)"><g class="fc" style="animation-duration:16.3s;animation-delay:-2.2s"><g class="spin" style="animation-duration:4.1s"><use href="#flower" transform="scale(0.34)" fill="#ffd6e8" opacity="0.64"/></g></g></g>
  <g transform="translate(363,0)"><g class="fc" style="animation-duration:15.5s;animation-delay:-3.9s"><g class="spin" style="animation-duration:8.6s"><use href="#petal" transform="scale(0.91)" fill="#ffd6e8" opacity="0.50"/></g></g></g>
  <g transform="translate(449,0)"><g class="fc" style="animation-duration:14.5s;animation-delay:-1.8s"><g class="spin" style="animation-duration:6.7s"><use href="#petal" transform="scale(0.73)" fill="#ff9fc8" opacity="0.64"/></g></g></g>
  <g transform="translate(78,0)"><g class="fa" style="animation-duration:12.9s;animation-delay:-12.3s"><g class="spin" style="animation-duration:4.4s"><use href="#petal" transform="scale(0.81)" fill="#ffb3d4" opacity="0.59"/></g></g></g>
  <g transform="translate(985,0)"><g class="fc" style="animation-duration:16.3s;animation-delay:-15.7s"><g class="spin" style="animation-duration:4.1s"><use href="#flower" transform="scale(0.50)" fill="#ffc0dc" opacity="0.46"/></g></g></g>
  <g transform="translate(738,0)"><g class="fc" style="animation-duration:15.3s;animation-delay:-11.7s"><g class="spin" style="animation-duration:3.5s"><use href="#petal" transform="scale(0.77)" fill="#ffc0dc" opacity="0.67"/></g></g></g>
  <g transform="translate(730,0)"><g class="fc" style="animation-duration:13.2s;animation-delay:-4.2s"><g class="spin" style="animation-duration:8.1s"><use href="#petal" transform="scale(0.76)" fill="#ffb3d4" opacity="0.68"/></g></g></g>
  <g transform="translate(215,0)"><g class="fa" style="animation-duration:9.3s;animation-delay:-8.6s"><g class="spin" style="animation-duration:7.3s"><use href="#petal" transform="scale(0.66)" fill="#ffe4f0" opacity="0.48"/></g></g></g>
  <g transform="translate(530,0)"><g class="fb" style="animation-duration:9.5s;animation-delay:-4.2s"><g class="spin" style="animation-duration:8.5s"><use href="#petal" transform="scale(0.63)" fill="#ffd6e8" opacity="0.57"/></g></g></g>
  <g transform="translate(953,0)"><g class="fa" style="animation-duration:13.6s;animation-delay:-0.8s"><g class="spin" style="animation-duration:3.9s"><use href="#flower" transform="scale(0.36)" fill="#ffc0dc" opacity="0.46"/></g></g></g>
  <g transform="translate(69,0)"><g class="fa" style="animation-duration:16.6s;animation-delay:-14.3s"><g class="spin" style="animation-duration:8.1s"><use href="#petal" transform="scale(0.71)" fill="#ffb3d4" opacity="0.54"/></g></g></g>
  <g transform="translate(452,0)"><g class="fa" style="animation-duration:15.0s;animation-delay:-3.5s"><g class="spin" style="animation-duration:3.3s"><use href="#flower" transform="scale(0.52)" fill="#ffc0dc" opacity="0.60"/></g></g></g>
  <g transform="translate(728,0)"><g class="fc" style="animation-duration:13.1s;animation-delay:-4.5s"><g class="spin" style="animation-duration:6.9s"><use href="#petal" transform="scale(0.56)" fill="#ffb3d4" opacity="0.54"/></g></g></g>
  <g transform="translate(226,0)"><g class="fc" style="animation-duration:11.6s;animation-delay:-0.6s"><g class="spin" style="animation-duration:8.1s"><use href="#petal" transform="scale(0.74)" fill="#ffd6e8" opacity="0.59"/></g></g></g>
  <!-- Nom -->
  <g class="name" filter="url(#glow)">
    <text x="500" y="150" text-anchor="middle" font-size="68" font-weight="800" letter-spacing="10" fill="url(#nameGrad)">CHIRINE HAMMAR</text>
  </g>
  <text x="500" y="190" text-anchor="middle" font-size="18" letter-spacing="6" fill="#ff9fc8">BTS SIO · OPTION SISR · MYDIGITALSCHOOL</text>

  <!-- Logos -->
  <g transform="translate(500,240)">
    <!-- Gmail -->
    <g transform="translate(-80,0)"><g class="ic">
      <circle r="22" fill="#ff7eb6" fill-opacity="0.18" stroke="#ff9fc8" stroke-width="1.5"/>
      <rect x="-12" y="-8.5" width="24" height="17" rx="2.5" fill="none" stroke="#ffe4f0" stroke-width="2.2"/>
      <path d="M-12,-7 L0,2.5 L12,-7" fill="none" stroke="#ffe4f0" stroke-width="2.2" stroke-linejoin="round"/>
    </g></g>
    <!-- GitHub -->
    <g><g class="ic" style="animation-delay:-1s">
      <circle r="22" fill="#ff7eb6" fill-opacity="0.18" stroke="#ff9fc8" stroke-width="1.5"/>
      <path transform="translate(-12,-12)" fill="#ffe4f0" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
    </g></g>
    <!-- LinkedIn -->
    <g transform="translate(80,0)"><g class="ic" style="animation-delay:-2s">
      <circle r="22" fill="#ff7eb6" fill-opacity="0.18" stroke="#ff9fc8" stroke-width="1.5"/>
      <rect x="-12" y="-12" width="24" height="24" rx="4" fill="#ffe4f0"/>
      <rect x="-8" y="-2" width="3.6" height="10" fill="#2b0f24"/>
      <circle cx="-6.2" cy="-6" r="2.1" fill="#2b0f24"/>
      <path d="M-1.6,-2 H1.8 V-0.4 C2.6,-1.8 4,-2.4 5.4,-2.4 C8,-2.4 8.6,-0.6 8.6,1.8 V8 H5 V2.6 C5,1.4 4.7,0.6 3.6,0.6 C2.4,0.6 1.8,1.5 1.8,2.8 V8 H-1.6 Z" fill="#2b0f24"/>
    </g></g>
  </g>

  <!-- Pétales au premier plan -->
  <g transform="translate(246,0)"><g class="fc" style="animation-duration:9.4s;animation-delay:-5.6s"><g class="spin" style="animation-duration:8.6s"><use href="#flower" transform="scale(0.88)" fill="#ffe4f0" opacity="0.83"/></g></g></g>
  <g transform="translate(618,0)"><g class="fa" style="animation-duration:8.1s;animation-delay:-0.2s"><g class="spin" style="animation-duration:4.0s"><use href="#petal" transform="scale(1.08)" fill="#ffe4f0" opacity="0.98"/></g></g></g>
