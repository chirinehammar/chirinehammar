  <g transform="translate(27,0)"><g class="fc" style="animation-duration:11.8s;animation-delay:-9.6s"><g class="spin" style="animation-duration:8.5s"><use href="#petal" transform="scale(1.02)" fill="#ffc0dc" opacity="0.91"/></g></g></g>
