  <g transform="translate(397,0)"><g class="fb" style="animation-duration:9.5s;animation-delay:-3.0s"><g class="spin" style="animation-duration:7.5s"><use href="#petal" transform="scale(1.47)" fill="#ffb3d4" opacity="0.88"/></g></g></g>
  <g transform="translate(57,0)"><g class="fc" style="animation-duration:10.4s;animation-delay:-8.5s"><g class="spin" style="animation-duration:5.6s"><use href="#petal" transform="scale(1.02)" fill="#ff9fc8" opacity="0.87"/></g></g></g>
  <g transform="translate(575,0)"><g class="fa" style="animation-duration:11.1s;animation-delay:-5.3s"><g class="spin" style="animation-duration:8.5s"><use href="#petal" transform="scale(1.40)" fill="#ffc0dc" opacity="0.97"/></g></g></g>
