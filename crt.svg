<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 600" width="1000" height="600" font-family="'Courier New', Courier, monospace">
  <defs>
    <!-- Lueur de l'écran -->
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1f5a2a"/>
      <stop offset="65%" stop-color="#103a18"/>
      <stop offset="100%" stop-color="#05160a"/>
    </radialGradient>
    <!-- Vignette (coins sombres de l'écran bombé) -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2f2b"/>
      <stop offset="100%" stop-color="#121412"/>
    </linearGradient>
    <!-- Bande lumineuse qui défile -->
    <linearGradient id="rollBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b6ffb0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#b6ffb0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#b6ffb0" stop-opacity="0"/>
    </linearGradient>
    <!-- Lignes de balayage -->
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.28"/>
    </pattern>
    <!-- Glow phosphore sur le texte -->
    <filter id="phosphor" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screenClip"><rect x="40" y="40" width="920" height="520" rx="38"/></clipPath>

    <style>
      .t   { fill: #b9ff9e; font-size: 21px; }
      .k   { fill: #7fe07a; }
      .big { fill: #e9ffd9; font-size: 34px; font-weight: bold; letter-spacing: 3px; }
      .dim { fill: #6fbf6a; font-size: 17px; }
      .flicker { animation: flicker 4s infinite steps(1); }
      @keyframes flicker {
        0%{opacity:1} 3%{opacity:.86} 6%{opacity:1} 41%{opacity:.93} 42%{opacity:1}
        77%{opacity:.88} 78%{opacity:1}
      }
      .roll { animation: roll 6s linear infinite; }
      @keyframes roll { from { transform: translateY(-140px) } to { transform: translateY(620px) } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .boot { animation: boot 1.2s ease-out both; transform-origin: 500px 300px; }
      @keyframes boot {
        0%   { transform: scale(1, 0.004); filter: brightness(4); }
        45%  { transform: scale(1, 0.004); filter: brightness(4); }
        70%  { transform: scale(1, 1.06); }
        100% { transform: scale(1, 1); filter: brightness(1); }
      }
    </style>
  </defs>

  <!-- Boîtier -->
  <rect x="0" y="0" width="1000" height="600" rx="46" fill="url(#bezel)"/>
  <rect x="30" y="30" width="940" height="540" rx="42" fill="#050805"/>

  <g clip-path="url(#screenClip)">
    <g class="boot">
      <g class="flicker">
        <rect x="40" y="40" width="920" height="520" fill="url(#screenGlow)"/>

        <!-- Portrait pixel art -->
        <rect x="70" y="70" width="440" height="440" fill="#0a1f0e"/>
        <image x="70" y="70" width="440" height="440" preserveAspectRatio="none"
               style="image-rendering: pixelated; image-rendering: crisp-edges"
               xlink:href="data:image/png;base64," href="data:image/png;base64,"/>

        <!-- Infos -->
        <g filter="url(#phosphor)">
          <text x="545" y="112" class="big">CHIRINE HAMMAR<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5;1" dur="1.6s" fill="freeze"/></text>
          <text x="547" y="142" class="dim">&gt; Étudiante BTS SIO · option SISR</text>

          <g class="t">
            <!-- Chaque ligne s'écrit comme à la machine -->
            <clipPath id="l1"><rect x="540" y="160" width="0" height="34"><animate attributeName="width" from="0" to="420" begin="1.4s" dur="0.6s" fill="freeze" calcMode="discrete" values="0;60;120;180;240;300;360;420"/></rect></clipPath>
            <text x="547" y="186" clip-path="url(#l1)"><tspan class="k">Nom:</tspan> Chirine Hammar</text>

            <clipPath id="l2"><rect x="540" y="196" width="0" height="34"><animate attributeName="width" begin="2.0s" dur="0.4s" fill="freeze" calcMode="discrete" values="0;80;160;240;420"/></rect></clipPath>
            <text x="547" y="222" clip-path="url(#l2)"><tspan class="k">Âge:</tspan> 20 ans</text>

            <clipPath id="l3"><rect x="540" y="232" width="0" height="34"><animate attributeName="width" begin="2.4s" dur="0.5s" fill="freeze" calcMode="discrete" values="0;80;160;240;320;420"/></rect></clipPath>
            <text x="547" y="258" clip-path="url(#l3)"><tspan class="k">École:</tspan> MyDigitalSchool</text>

            <clipPath id="l4"><rect x="540" y="268" width="0" height="34"><animate attributeName="width" begin="2.9s" dur="0.4s" fill="freeze" calcMode="discrete" values="0;100;200;300;420"/></rect></clipPath>
            <text x="547" y="294" clip-path="url(#l4)"><tspan class="k">OS:</tspan> Windows</text>

            <clipPath id="l5"><rect x="540" y="304" width="0" height="34"><animate attributeName="width" begin="3.3s" dur="0.4s" fill="freeze" calcMode="discrete" values="0;100;200;300;420"/></rect></clipPath>
            <text x="547" y="330" clip-path="url(#l5)"><tspan class="k">Formation:</tspan> BTS SIO</text>

            <clipPath id="l6"><rect x="540" y="340" width="0" height="64"><animate attributeName="width" begin="3.7s" dur="0.7s" fill="freeze" calcMode="discrete" values="0;70;140;210;280;350;420"/></rect></clipPath>
            <text x="547" y="366" clip-path="url(#l6)"><tspan class="k">Option:</tspan> SISR</text>
            <text x="648" y="394" clip-path="url(#l6)" class="dim">(Systèmes &amp; Réseaux)</text>

            <clipPath id="l7"><rect x="540" y="404" width="0" height="64"><animate attributeName="width" begin="4.4s" dur="0.7s" fill="freeze" calcMode="discrete" values="0;70;140;210;280;350;420"/></rect></clipPath>
            <text x="547" y="430" clip-path="url(#l7)"><tspan class="k">Skills:</tspan> Réseaux, Linux,</text>
            <text x="648" y="458" clip-path="url(#l7)">Cisco, Cybersécurité</text>
          </g>

          <!-- Palette de couleurs façon neofetch -->
          <g opacity="0">
            <animate attributeName="opacity" begin="5.1s" dur="0.3s" to="1" fill="freeze"/>
            <rect x="547" y="478" width="34" height="22" fill="#1c4a22"/>
            <rect x="581" y="478" width="34" height="22" fill="#d9822b"/>
            <rect x="615" y="478" width="34" height="22" fill="#33d16b"/>
            <rect x="649" y="478" width="34" height="22" fill="#e6e65a"/>
            <rect x="683" y="478" width="34" height="22" fill="#3fbf8f"/>
            <rect x="717" y="478" width="34" height="22" fill="#c06a8a"/>
            <rect x="751" y="478" width="34" height="22" fill="#2fe07a"/>
            <rect x="785" y="478" width="34" height="22" fill="#a8f0a0"/>
            <rect x="547" y="500" width="34" height="22" fill="#5fae5c"/>
            <rect x="581" y="500" width="34" height="22" fill="#e9c97a"/>
            <rect x="615" y="500" width="34" height="22" fill="#8fe08a"/>
            <rect x="649" y="500" width="34" height="22" fill="#f4f47a"/>
            <rect x="683" y="500" width="34" height="22" fill="#8fe0b8"/>
            <rect x="717" y="500" width="34" height="22" fill="#e8d0d8"/>
            <rect x="751" y="500" width="34" height="22" fill="#c8f8d8"/>
            <rect x="785" y="500" width="34" height="22" fill="#eaffe4"/>
          </g>

          <!-- Prompt -->
          <text x="72" y="542" class="t">chirine@github:~$ <tspan class="cursor">█</tspan></text>
        </g>

        <!-- Effets CRT -->
        <rect x="40" y="40" width="920" height="520" fill="url(#scan)"/>
        <rect class="roll" x="40" y="40" width="920" height="120" fill="url(#rollBar)"/>
        <rect x="40" y="40" width="920" height="520" fill="url(#vignette)"/>
      </g>
    </g>
  </g>

  <!-- Reflet sur la vitre -->
  <path d="M80 60 Q 500 30 920 60 L 900 110 Q 500 80 100 110 Z" fill="#ffffff" fill-opacity="0.035"/>
</svg>
